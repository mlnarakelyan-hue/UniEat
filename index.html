      to {

        transform: translateY(0);
      }
    }

    // ==========================================
    // 2. HELPER UTILITIES

    function formatAMD(amount) {
      return amount.toLocaleString('en-US') + ' AMD';
    }

    function getItemById(id) {
      return MENU_ITEMS.find(item => item.id === id) || MENU_ITEMS[0];
    }

    function getItemUnitPrice(item, size = 'Regular') {
      return item.price + (size === 'Large' ? 300 : 0);
    }

    function getCartTotal() {
      return state.cart.reduce((sum, entry) => {
        const item = getItemById(entry.id);
        return sum + getItemUnitPrice(item, entry.size) * entry.qty;
      }, 0);
    }

    function getCartCount() {
      return state.cart.reduce((sum, entry) => sum + entry.qty, 0);
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    // ==========================================
    // 3. CART & ORDER ACTIONS
    // ==========================================
    function addToCart(productId, size = 'Regular', event = null) {
      if (event) event.stopPropagation();
      const existing = state.cart.find(c => c.id === productId && c.size === size);
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({ id: productId, size, qty: 1 });
      }
      const item = getItemById(productId);
      updateNavBadges();
      showToast(`${item.name} (${size}) added to cart`);
      if (state.screen === 'cart') render();
    }

    function updateCartQty(index, delta) {
      if (!state.cart[index]) return;
      state.cart[index].qty += delta;
      if (state.cart[index].qty <= 0) {
        state.cart.splice(index, 1);
      }
      updateNavBadges();
      render();
    }

    function removeCartItem(index) {
      state.cart.splice(index, 1);
      updateNavBadges();
      showToast('Item removed from cart');
      render();
    }

      state.selectedSize = 'Regular';

    }

    function openCategory(categoryName) {
      state.selectedCategory = categoryName;
      if (categoryName === 'Coffee') state.selectedSubCategory = 'Iced Drinks';
      else if (categoryName === 'Lunch') state.selectedSubCategory = 'All';
      else if (categoryName === 'Breakfast') state.selectedSubCategory = 'All';
      else if (categoryName === 'Snacks') state.selectedSubCategory = 'All';
      else state.selectedSubCategory = 'All';
      navigate('category');
    }

    function toggleFavorite(productId, event) {
      if (event) event.stopPropagation();
      if (state.favorites.has(productId)) {
        state.favorites.delete(productId);
        showToast('Removed from favorites');
      } else {
        state.favorites.add(productId);
        showToast('Saved to favorites');
      }
      render();
    }

    function confirmOrder() {
      if (state.cart.length === 0) {
        showToast('Your cart is empty');
        return;
      }
      const orderItems = state.cart.map(entry => {
        const item = getItemById(entry.id);
        return {
          id: entry.id,
          size: entry.size,
          qty: entry.qty,
          unitPrice: getItemUnitPrice(item, entry.size)
        };
      });
      const total = getCartTotal();
      const randomNum = Math.floor(1044 + Math.random() * 50);

      state.activeOrder = {
        id: `#${randomNum}`,
        date: '26 Nov 2026, 13:45',
        status: 'Preparing',
        items: orderItems,
        total,
        feedbackSubmitted: false,
        rating: 5
      };

      state.cart = [];
      updateNavBadges();
      navigate('confirmed');
    }

    // ==========================================
    // 4. NAVIGATION & UI SHELL UPDATES
    // ==========================================
    let splashAutoTimer = null;

    function navigate(screenName) {
      clearTimeout(splashAutoTimer);
      state.screen = screenName;
      render();
    }

    function updateNavBadges() {
      const badge = document.getElementById('cart-badge');
      const count = getCartCount();
      if (badge) {
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
      }
    }

    function updateBottomNavVisibility() {
      const nav = document.getElementById('bottom-nav');
      const visibleScreens = ['home', 'category', 'cart', 'my-order', 'profile'];
      if (visibleScreens.includes(state.screen)) {
        nav.classList.remove('hidden');
      } else {
        nav.classList.add('hidden');
      }

      // Highlight active tab
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        const isActive = (target === state.screen) || (target === 'home' && state.screen === 'category');
        if (isActive) {
          btn.classList.remove('text-ink-secondary');
          btn.classList.add('text-olive-dark');
          btn.querySelector('span:last-child').classList.add('font-bold');
        } else {
          btn.classList.add('text-ink-secondary');
          btn.classList.remove('text-olive-dark');
          btn.querySelector('span:last-child').classList.remove('font-bold');
        }
      });

      updateNavBadges();
    }

          <p class="text-xs text-ink-secondary mt-0.5">Présentez ce QR code au comptoir UniEat</p>

          <!-- Crisp Vector QR Code -->
          <div class="my-4 mx-auto w-48 h-48 p-3.5 bg-white rounded-2xl border-2 border-olive-dark shadow-inner flex items-center justify-center">
            <svg viewBox="0 0 100 100" class="w-full h-full fill-olive-dark">
              <rect x="6" y="6" width="26" height="26" rx="3" fill="none" stroke="#2C3923" stroke-width="5"/>
              <rect x="13" y="13" width="12" height="12" rx="1.5"/>
              <rect x="68" y="6" width="26" height="26" rx="3" fill="none" stroke="#2C3923" stroke-width="5"/>
              <rect x="75" y="13" width="12" height="12" rx="1.5"/>
              <rect x="6" y="68" width="26" height="26" rx="3" fill="none" stroke="#2C3923" stroke-width="5"/>
              <rect x="13" y="75" width="12" height="12" rx="1.5"/>
              <rect x="42" y="8" width="6" height="6"/><rect x="54" y="8" width="6" height="12"/>
              <rect x="42" y="22" width="12" height="6"/><rect x="8" y="42" width="12" height="6"/>
              <rect x="26" y="42" width="6" height="18"/><rect x="38" y="38" width="24" height="24" rx="4" fill="#E7ECE0"/>
              <text x="50" y="53" text-anchor="middle" font-size="8" font-weight="800" font-family="sans-serif">UFAR</text>
              <rect x="68" y="42" width="12" height="6"/><rect x="86" y="42" width="8" height="14"/>
              <rect x="42" y="68" width="6" height="12"/><rect x="54" y="74" width="14" height="6"/>
              <rect x="74" y="68" width="18" height="6"/><rect x="68" y="82" width="10" height="12"/>
              <rect x="84" y="80" width="10" height="14"/>
            </svg>
          </div>

          <p class="text-xs font-bold text-olive-dark">${state.user.name} • ${formatAMD(state.activeOrder.total)}</p>
          <button onclick="closeModal()" class="mt-4 w-full py-3 rounded-2xl bg-olive-dark text-white text-xs font-bold">Done</button>
        </div>
      `;
      overlay.classList.remove('hidden');
    }

    function openFeedbackModal() {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <div>
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-ink-primary">Votre avis (Feedback)</h3>
            <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-cream-bg text-ink-primary text-xs font-bold">✕</button>
          </div>
          <p class="text-xs text-ink-secondary mt-1">Comment était votre commande à la cafétéria UFAR ?</p>
          <div class="flex justify-center gap-2 my-4 text-2xl">
            ${[1,2,3,4,5].map(star => `
              <button onclick="state.activeOrder.rating=${star}; openFeedbackModal();" class="transition transform hover:scale-110">
                ${star <= state.activeOrder.rating ? '⭐' : '☆'}
              </button>
            `).join('')}
          </div>
          <textarea rows="2" placeholder="Rapide, chaud et délicieux..." class="w-full p-3 rounded-2xl bg-cream-bg border border-olive-light text-xs focus:outline-none"></textarea>
          <button onclick="state.activeOrder.feedbackSubmitted=true; closeModal(); showToast('Merci pour votre avis !'); render();" class="mt-3 w-full py-3 rounded-2xl bg-olive-dark text-white text-xs font-bold">
            Envoyer mon avis
          </button>
        </div>
      `;
      overlay.classList.remove('hidden');
    }

    function openSwitchStudentModal() {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-base font-extrabold text-ink-primary">Équipe UniEat UFAR</h3>
            <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-cream-bg text-ink-primary text-xs font-bold">✕</button>
          </div>
          <div class="space-y-2 max-h-64 overflow-y-auto">
            ${TEAM_PROFILES.map((member, idx) => `
              <button onclick="state.user = TEAM_PROFILES[${idx}]; closeModal(); showToast('Switched to ${member.firstName}'); render();" class="w-full p-2.5 rounded-2xl border ${state.user.name === member.name ? 'bg-olive-tint border-olive-dark' : 'bg-cream-bg border-olive-light/60'} flex items-center justify-between text-left">
                <div>
                  <p class="text-xs font-bold text-ink-primary">${member.name}</p>
                  <p class="text-[10px] text-ink-secondary">${member.email}</p>
                </div>
                ${state.user.name === member.name ? '<span class="text-xs font-bold text-olive-dark">✓</span>' : ''}
              </button>
            `).join('')}
          </div>
        </div>
      `;
      overlay.classList.remove('hidden');
    }

    function openAboutModal() {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-base font-extrabold text-ink-primary">À propos d'UniEat UFAR</h3>
            <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-cream-bg text-ink-primary text-xs font-bold">✕</button>
          </div>
          <p class="text-xs text-ink-secondary leading-relaxed">
            Application mobile de précommande conçue pour la cafétéria de l'Université française en Arménie (UFAR). Commandez à l'avance, payez en ligne et récupérez votre repas sans attendre au guichet « Fast Express ».
          </p>
          <button onclick="closeModal()" class="mt-4 w-full py-3 rounded-2xl bg-olive-dark text-white text-xs font-bold">Fermer</button>
        </div>
      `;
      overlay.classList.remove('hidden');
    }

    // ==========================================
    // 7. MAIN RENDER LOOP
    // ==========================================
    function render() {
      const container = document.getElementById('screen-container');
      let html = '';

      switch (state.screen) {
        case 'splash':
          html = renderSplashScreen();
          break;
        case 'onboarding':
          html = renderOnboardingScreen();
          break;
        case 'home':
          html = renderHomeScreen();
          break;
        case 'category':
          html = renderCategoryScreen();
          break;
        case 'product':
          html = renderProductScreen();
          break;
        case 'cart':
          html = renderCartScreen();
          break;
        case 'checkout':
          html = renderCheckoutScreen();
          break;
        case 'confirmed':
          html = renderConfirmedScreen();
          break;
        case 'my-order':
          html = renderMyOrderScreen();
          break;
        case 'profile':
          html = renderProfileScreen();
          break;
        default:
          html = renderHomeScreen();
      }

      container.innerHTML = html;
      container.scrollTop = 0;
      updateBottomNavVisibility();
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
